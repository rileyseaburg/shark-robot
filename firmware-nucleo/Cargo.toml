[package]
name = "shark-nucleo"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.5", features = ["stm32f446re", "time-driver-any", "exti"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embassy-sync = { version = "0.6" }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

static_cell = "2.1"

[profile.release]
opt-level = "s"
debug = true
lto = true

[profile.dev]
opt-level = 1
